<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#021024" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Neon Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#haloGrad)" />

  <!-- Inner Deep Contrast Base -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#021024" />
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#centerGlow)" />

  <!-- Growth Vector Arrow -->
  <path d="M 12 41 L 24 28 L 33 34 L 49 16" 
        stroke="url(#trendGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Arrowhead -->
  <path d="M 39 16 H 49 V 26" 
        stroke="url(#trendGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Central Dollar Badge with High Contrast -->
  <circle cx="28" cy="34" r="11" fill="#021024" stroke="url(#haloGrad)" stroke-width="2.5" />
  
  <!-- Dollar Vertical Spine -->
  <line x1="28" y1="26" x2="28" y2="42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  
  <!-- Dollar Curve in Pure Solid White -->
  <path d="M 32 30 C 32 27.5 30.5 26.8 28 26.8 C 25.5 26.8 24.2 27.8 24.2 29.5 C 24.2 32.5 32 32 32 35.2 C 32 37.2 30.5 38.5 28 38.5 C 25.2 38.5 24 37.2 24 35.5" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>
